name: Screens

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Režimas: shot – 540 px ekrano nuotrauka; video – 6 kadrų lapas"
        required: true
        default: shot
        type: choice
        options:
          - shot
          - video

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android SDK packages (with retry)
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          timeout_minutes: 20
          retry_wait_seconds: 15
          shell: bash
          command: |
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" --install emulator platform-tools "platforms;android-34" \
              "system-images;android-34;google_apis;x86_64" > /dev/null
            test -x "$ANDROID_HOME/emulator/emulator"

      - name: Run emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MODE: ${{ inputs.mode || 'shot' }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/capture.sh "$MODE" screens

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gnss-screens
          path: screens/
