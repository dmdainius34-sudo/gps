# GitLab CI: vienetų testai ir debug APK (atitinka .github/workflows/build.yml)
# Rezultatas – artifact „app-debug“ (app/build/outputs/apk/debug/app-debug.apk)

image: gradle:8.9-jdk17

variables:
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  CMDLINE_TOOLS_ZIP: "commandlinetools-linux-11076708_latest.zip"

cache:
  key: android-sdk-34
  paths:
    - .android-sdk/
    - .gradle-home/caches/
    - .gradle-home/wrapper/

stages:
  - build

app-debug:
  stage: build
  before_script:
    - apt-get update -qq && apt-get install -y -qq unzip wget > /dev/null
    - |
      if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        wget -q "https://dl.google.com/android/repository/$CMDLINE_TOOLS_ZIP" -O /tmp/cmdline.zip
        unzip -q /tmp/cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      fi
    - yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
    - '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null'
  script:
    - gradle testDebugUnitTest --no-daemon
    - gradle assembleDebug --no-daemon
  artifacts:
    name: app-debug
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
    expire_in: 30 days
